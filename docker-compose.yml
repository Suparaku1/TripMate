version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tripmate_postgres
    environment:
      POSTGRES_USER: tripmate_user
      POSTGRES_PASSWORD: 0iDk5#RCDHjEnLK&tIPmKijP
      POSTGRES_DB: tripmate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tripmate_app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: tripmate_user
      POSTGRES_PASSWORD: 0iDk5#RCDHjEnLK&tIPmKijP
      POSTGRES_DB: tripmate_db
      DATABASE_URL: "postgresql://tripmate_user:0iDk5#RCDHjEnLK&tIPmKijP@postgres:5432/tripmate_db?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
